name: Update data
on:
  schedule:
    - cron: "7 */2 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/requirements.txt
      - run: pip install -r bot/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Tests
        working-directory: bot
        run: python -m pytest -q
      - name: Fetch and update
        id: run
        working-directory: bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT: ${{ secrets.TELEGRAM_ALERT_CHAT }}
        run: python -m rdbot.run
      - name: Commit data
        id: commit
        run: |
          git config user.name "resultdosti-bot"
          git config user.email "bot@resultdosti.in"
          git add data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ steps.run.outputs.site_changed }}" = "true" ]; then
            git commit -m "Data update $(date -u +%Y-%m-%dT%H:%MZ)"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            git commit -m "[CI Skip] State update $(date -u +%Y-%m-%dT%H:%MZ)"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && break
            sleep 10
          done
      - name: Notify search engines and Telegram
        if: steps.commit.outputs.changed == 'true'
        working-directory: bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT: ${{ secrets.TELEGRAM_ALERT_CHAT }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
        run: python -m rdbot.ping
      - name: Alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT: ${{ secrets.TELEGRAM_ALERT_CHAT }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_ALERT_CHAT" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d chat_id="${TELEGRAM_ALERT_CHAT}" -d text="ResultDosti update run failed: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi
