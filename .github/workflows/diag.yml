name: Diagnose sources
on:
  workflow_dispatch:
    inputs:
      urls:
        description: URLs separated by spaces (empty = default set)
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: data
  cancel-in-progress: false
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/requirements.txt
      - run: pip install -r bot/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: curl -s https://ipinfo.io/json || true
      - name: Diagnose
        env:
          URLS: ${{ github.event.inputs.urls }}
        run: python bot/tools/diag.py $(printf '%s' "$URLS" | tr -cd 'A-Za-z0-9:/._?=&% -') | tee diag.txt
      - name: Peek
        working-directory: bot
        run: python tools/peek.py | tee ../peek.txt
      - name: Save output
        run: |
          mkdir -p data/diag
          cp diag.txt data/diag/latest.txt
          cp peek.txt data/diag/peek.txt
          git config user.name "resultdosti-bot"
          git config user.email "bot@resultdosti.in"
          git add data/diag
          git diff --cached --quiet && exit 0
          git commit -m "[CI Skip] Diagnostics"
          for i in 1 2 3; do git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && break; sleep 10; done
