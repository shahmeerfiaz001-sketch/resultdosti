name: Diagnose sources
on:
  workflow_dispatch:
    inputs:
      urls:
        description: URLs separated by spaces (empty = default set)
        required: false
        default: ""
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/requirements.txt
      - run: pip install -r bot/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: curl -s https://ipinfo.io/json || true
      - name: Diagnose
        env:
          URLS: ${{ github.event.inputs.urls }}
        run: python bot/tools/diag.py $(printf '%s' "$URLS" | tr -cd 'A-Za-z0-9:/._?=&%-  ') | tee diag.txt
      - uses: actions/upload-artifact@v4
        with:
          name: diag
          path: diag.txt
